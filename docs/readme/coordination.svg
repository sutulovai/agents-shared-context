<svg xmlns="http://www.w3.org/2000/svg" width="640" height="564" viewBox="0 0 640 564" role="img" aria-labelledby="title description">
  <title id="title">One checkout, two sessions</title>
  <desc id="description">Session A edits src/api.ts and Session B edits test/api.test.ts in parallel. When Session B submits a patch for both files, the claim on src/api.ts blocks the whole patch before either file changes.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#334968" stroke-opacity=".3"/>
    </pattern>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#172b48"/>
      <stop offset="1" stop-color="#0b1221"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="640" height="564" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <path d="M0 0h640v564H0z" fill="url(#background)"/>
    <path d="M0 0h640v564H0z" fill="url(#grid)"/>
    <rect x=".5" y=".5" width="639" height="563" rx="23.5" fill="none" stroke="#405579"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#f4f7ff">
    <path d="m33 25 8 8-8 8-8-8z" fill="#76e5c2"/>
    <text x="51" y="40" fill="#b5c7e2" font-size="20" font-weight="700" letter-spacing="1.3">OPENCODE SESSION COORDINATION</text>
    <text x="24" y="92" font-size="45" font-weight="750" letter-spacing="-1.35">One checkout. Two sessions.</text>
    <rect x="24" y="118" width="592" height="184" rx="16" fill="#111c30" stroke="#405579"/>
    <rect x="24" y="318" width="592" height="184" rx="16" fill="#111c30" stroke="#405579"/>
    <rect x="40" y="134" width="40" height="36" rx="8" fill="#24413f"/>
    <rect x="40" y="334" width="40" height="36" rx="8" fill="#483537"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">
      <text x="60" y="159" fill="#76e5c2">01</text>
      <text x="60" y="359" fill="#ffc392">02</text>
    </g>
    <g font-size="30" font-weight="700" letter-spacing="-.5">
      <text x="94" y="162">Separate edits proceed</text>
      <text x="94" y="362">Entire patch blocked</text>
    </g>
    <g fill="#192b44" stroke="#344968">
      <rect x="40" y="184" width="560" height="48" rx="8"/>
      <rect x="40" y="240" width="560" height="48" rx="8"/>
      <rect x="40" y="384" width="560" height="48" rx="8"/>
    </g>
    <rect x="40" y="440" width="560" height="48" rx="8" fill="#322733" stroke="#a36e60"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23">
      <text x="100" y="216">src/api.ts</text>
      <text x="100" y="272">test/api.test.ts</text>
      <text x="100" y="416">src/api.ts</text>
      <text x="100" y="472">Patch for both files</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">
      <rect x="52" y="193" width="34" height="30" rx="5" fill="#76e5c2"/>
      <text x="69" y="215" fill="#102b29">A</text>
      <rect x="52" y="249" width="34" height="30" rx="5" fill="#b5cbff"/>
      <text x="69" y="271" fill="#172341">B</text>
      <rect x="52" y="393" width="34" height="30" rx="5" fill="#76e5c2"/>
      <text x="69" y="415" fill="#102b29">A</text>
      <rect x="52" y="449" width="34" height="30" rx="5" fill="#b5cbff"/>
      <text x="69" y="471" fill="#172341">B</text>
    </g>
    <g fill="none" stroke="#76e5c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="m564 208 5 5 10-12m-15 63 5 5 10-12"/>
    </g>
    <g text-anchor="end" font-size="21" font-weight="650">
      <text x="580" y="415" fill="#b5c7e2">Still held by A</text>
      <text x="580" y="471" fill="#ffc392">No changes</text>
    </g>
    <path d="M24 519h592" stroke="#405579"/>
    <text x="24" y="544" fill="#b5c7e2" font-size="21">Local Redis leases · Supported OpenCode edits</text>
  </g>
</svg>
